name: Publish OTA firmware

# The device downloads only firmware binaries and JSON manifests.
on:
  push:
    branches: [dev]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: 'OTA channel to publish'
        required: true
        default: 'dev'
        type: choice
        options: [dev, stable]

permissions:
  contents: write

concurrency:
  group: ota-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Resolve channel and version
        id: meta
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            CHANNEL="${{ inputs.channel }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            CHANNEL="stable"
          else
            CHANNEL="dev"
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          elif [[ "$CHANNEL" == "stable" ]]; then
            VERSION="manual-${GITHUB_SHA::7}"
          else
            VERSION=$(git describe --tags --always)
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build firmware (V1.2)
        env:
          PLATFORMIO_BUILD_FLAGS: ${{ steps.meta.outputs.channel == 'stable' && '-DDEBUG_BUILD=0' || '' }}
        run: pio run -e wireless-paper-v1_2

      - name: Build firmware (V1.1)
        env:
          PLATFORMIO_BUILD_FLAGS: ${{ steps.meta.outputs.channel == 'stable' && '-DDEBUG_BUILD=0' || '' }}
        run: pio run -e wireless-paper-v1_1

      - name: Assemble OTA bundle
        run: |
          python scripts/assemble_ota.py \
            --channel "${{ steps.meta.outputs.channel }}" \
            --version "${{ steps.meta.outputs.version }}" \
            --commit "${GITHUB_SHA::7}"

      - name: Publish OTA files to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          keep_files: true
          commit_message: "Deploy OTA ${{ steps.meta.outputs.channel }} ${{ steps.meta.outputs.version }}"
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.meta.outputs.version }}
          path: site/${{ steps.meta.outputs.channel }}/firmware-*.bin
          retention-days: 30

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber site/stable/firmware-*.bin
          else
            gh release create "$TAG" --generate-notes --title "$TAG" \
              site/stable/firmware-*.bin
          fi
