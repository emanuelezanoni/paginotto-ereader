; PlatformIO Project Configuration
;
; Layout:
;   Paginotto/Paginotto.ino    — firmware entry point
;   Paginotto/src/                — firmware modules (hal/, pure/, storage/, ui/, web/)
;   Paginotto/partitions.csv      — partition table

[platformio]
src_dir = Paginotto

[env]
; pioarduino fork — ships Arduino framework 3.x (IDF 5.x). The classic
; `platformio/espressif32` registry build is still on
; 2.0.17 (IDF 4.4), which keeps Heltec's deep-sleep path on a code branch that
; powers off RTC_PERIPH and breaks ext0 wake. See src/ui/sleep.cpp for context.
; Pinned to release 55.03.38-1 (arduino-esp32 3.3.8 / IDF 5.5.4) so builds are
; reproducible; bump deliberately. The previous `stable` URL is a moving alias.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = Paginotto/partitions.csv
board_build.filesystem = littlefs
extra_scripts = pre:scripts/build_info.py

; test/ holds host-side CMake unit tests, not PlatformIO on-device tests.
; Tell `pio test` to ignore everything in there so it doesn't try to compile
; laptop-only tests onto the ESP32.
test_ignore = *

; Static analysis — run with: pio check -e wireless-paper-v1_2
; check_skip_packages keeps cppcheck off the framework/library headers.
check_tool = cppcheck
check_severity = high, medium, low
check_flags =
  cppcheck: --enable=warning,style,performance,portability
            --suppress=missingIncludeSystem
            --suppress=*:*libdeps*
check_skip_packages = yes

lib_deps =
  https://github.com/todd-herbert/heltec-eink-modules.git#v4.6.0
  adafruit/Adafruit GFX Library @ 1.12.6
  olikraus/U8g2_for_Adafruit_GFX @ 1.8.0
  ; Improv Serial protocol (improv-wifi.com) — browser-side Wi-Fi provisioning
  ; over USB-CDC, wrapped by src/hal/wifi_provisioning.cpp. Pinned to a commit
  ; (no tagged release) for reproducible builds.
  https://github.com/jnthas/Improv-WiFi-Library.git#e37c244e0080349e191252acf4bce146eca118e0
  ; JSON parser for OTA manifest fetch (src/hal/ota.cpp).
  bblanchon/ArduinoJson @ 7.2.1
  ; Small fixed-version QR encoder used only by the device WebUI connection screen.
  https://github.com/ricmoo/QRCode.git#master

; Board environments — the firmware has one built-in string table.
[env:wireless-paper-v1_2]
build_flags =
  -D WIRELESS_PAPER
  -D DISPLAY_V1_2

[env:wireless-paper-v1_1]
build_flags =
  -D WIRELESS_PAPER
  -D DISPLAY_V1_1
